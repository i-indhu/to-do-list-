<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History | MyTask</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="header">

        <a href="index.html" class="logo">
            <div class="logo-icon">
                <img src="logo.png" alt="Taskly Logo" class="logo-img" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">
            </div>
            <span>MyTask</span>
        </a>

        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="tasks.html">Tasks</a>
            <a href="calendar.html">Calendar</a>
            <a href="projects.html">Projects</a>
            <a href="notes.html">Notes</a>
            <a href="history.html">History</a>
        </nav>

        <div class="header-buttons">
            <a href="login.html" class="login-btn">Log in</a>
            <a href="signup.html" class="signup-btn">Sign up</a>
        </div>

        <button class="mobile-menu-btn" aria-label="Toggle menu">
            <i class="fa-solid fa-bars"></i>
        </button>

    </header>


    <main class="page">

        <section class="page-top">
            <div>
                <span class="small-title">ACTIVITY</span>
                <h1>History</h1>
                <p>Review the tasks you've already completed.</p>
            </div>

            <button type="button" class="clear-history-btn" id="clearHistoryBtn">
                <i class="fa-solid fa-trash"></i>
                Clear History
            </button>
        </section>

        <section class="task-summary">

            <div class="summary-card">
                <div class="summary-icon green">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div>
                    <span>Completed Tasks</span>
                    <h2 id="statCompleted">0</h2>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon purple">
                    <i class="fa-solid fa-percent"></i>
                </div>
                <div>
                    <span>Completion Rate</span>
                    <h2 id="statRate">0%</h2>
                </div>
            </div>

        </section>

        <section class="history-list" id="historyList"></section>

    </main>

    <script src="storage.js"></script>
    <script src="common.js"></script>
    <script src="history.js"></script>

</body>
</html>
