<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tasks | MyTask</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="index.html" class="logo">
            <div class="logo-icon">
                <img src="logo.png" alt="Taskly Logo" class="logo-img" style="width:100%;height:100%;object-fit:cover;border-radius:10px;">
            </div>
            <span>MyTask</span>
        </a>

        <nav class="nav-menu">
            <a href="index.html">Home</a>
            <a href="tasks.html">Tasks</a>
            <a href="calendar.html">Calendar</a>
            <a href="projects.html">Projects</a>
            <a href="notes.html">Notes</a>
            <a href="history.html">History</a>
        </nav>

        <div class="header-buttons">
            <a href="login.html" class="login-btn">Log in</a>
            <a href="signup.html" class="signup-btn">Sign up</a>
        </div>

        <button class="mobile-menu-btn" aria-label="Toggle menu">
            <i class="fa-solid fa-bars"></i>
        </button>

    </header>


    <!-- TASK PAGE -->
    <main class="page">

        <section class="page-top">
            <div>
                <span class="small-title">PERSONAL TASKS</span>
                <h1>My Tasks</h1>
                <p>Keep track of everything you need to get done.</p>
            </div>

            <button type="button" class="primary-btn" id="addTaskButton">
                <i class="fa-solid fa-plus"></i>
                Add Task
            </button>
        </section>

        <!-- SUMMARY -->
        <section class="task-summary">

            <div class="summary-card">
                <div class="summary-icon blue">
                    <i class="fa-solid fa-list-check"></i>
                </div>
                <div>
                    <span>Total Tasks</span>
                    <h2 id="statTotal">0</h2>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon orange">
                    <i class="fa-regular fa-clock"></i>
                </div>
                <div>
                    <span>In Progress</span>
                    <h2 id="statProgress">0</h2>
                </div>
            </div>

            <div class="summary-card">
                <div class="summary-icon green">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div>
                    <span>Completed</span>
                    <h2 id="statCompleted">0</h2>
                </div>
            </div>

        </section>

        <!-- FILTERS -->
        <section class="task-toolbar">

            <div class="task-filters" id="filterTabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="today">Today</button>
                <button class="filter-tab" data-filter="week">This Week</button>
                <button class="filter-tab" data-filter="month">This Month</button>
            </div>

            <div class="task-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="taskSearch" placeholder="Search tasks...">
            </div>

        </section>

        <!-- TASK LIST -->
        <section class="task-list" id="taskListContainer"></section>

    </main>


    <!-- ADD / EDIT TASK MODAL -->
    <div class="modal-overlay" id="taskModal">
        <div class="task-modal">

            <div class="modal-header">
                <div>
                    <h2 id="modalTitle">Add New Task</h2>
                    <p id="modalSubtitle">Plan your next task and keep your day organized.</p>
                </div>
                <button type="button" class="close-modal" id="closeModal" aria-label="Close modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="taskForm">

                <input type="hidden" id="taskId">

                <div class="form-group">
                    <label for="taskName">Task Name</label>
                    <input id="taskName" type="text" placeholder="Example: Finish homepage design" required>
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Add some details about this task..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskDate">Due Date</label>
                        <input id="taskDate" type="date" required>
                    </div>
                    <div class="form-group">
                        <label for="taskTime">Time</label>
                        <input id="taskTime" type="time">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskCategory">Category</label>
                        <select id="taskCategory">
                            <option value="personal" selected>Personal</option>
                            <option value="work">Work</option>
                            <option value="study">Study</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-task" id="cancelTask">Cancel</button>
                    <button type="submit" class="save-task" id="saveTaskBtn">
                        <i class="fa-solid fa-plus"></i>
                        Add Task
                    </button>
                </div>

            </form>

        </div>
    </div>

    <script src="storage.js"></script>
    <script src="common.js"></script>
    <script src="tasks.js"></script>

</body>
</html>
